name: Desktop

on:
  push:
    branches: [main]
    paths: ['desktop/**', 'cmd/**', 'internal/**', 'web/**', 'go.mod', 'go.sum', 'tests/desktop/**', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['desktop/**', 'cmd/**', 'internal/**', 'web/**', 'go.mod', 'go.sum', 'tests/desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  packages:
    name: Desktop (${{ matrix.os }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, arch: arm64, executable: 'dist/mac-arm64/Timone.app/Contents/MacOS/Timone' }
          - { os: macos-15-intel, arch: x64, executable: 'dist/mac/Timone.app/Contents/MacOS/Timone' }
          - { os: ubuntu-24.04, arch: x64, executable: 'dist/linux-unpacked/timone-desktop' }
          - { os: ubuntu-24.04-arm, arch: arm64, executable: 'dist/linux-arm64-unpacked/timone-desktop' }
          - { os: windows-2025, arch: x64, executable: 'dist/win-unpacked/timone-desktop.exe' }
    defaults:
      run:
        shell: bash
    env:
      CI: true
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: desktop/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: |
            desktop/pnpm-lock.yaml
            web/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir desktop install --frozen-lockfile
          pnpm --dir desktop exec install-electron
          go mod download
          go mod verify

      - name: Build frontend and bundled backend
        env:
          CGO_ENABLED: '0'
        run: |
          python3 scripts/version.py --check
          pnpm --dir web run build
          mkdir -p desktop/resources
          binary=timone
          if [[ "$RUNNER_OS" == Windows ]]; then binary=timone.exe; fi
          go build -trimpath -ldflags='-s -w' -o "desktop/resources/$binary" ./cmd/timone
          pnpm --dir desktop run icons
          pnpm --dir desktop test

      - name: Install Linux desktop test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb libgtk-3-0t64 libnss3 libasound2t64 libgbm1 libxss1 libxtst6
          # Permit Chromium's sandbox in the disposable hosted test VM.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Test desktop application
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a pnpm --dir desktop run test:app
          else
            pnpm --dir desktop run test:app
          fi

      - name: Package native installers
        working-directory: desktop
        env:
          DESKTOP_ARCH: ${{ matrix.arch }}
        run: |
          # dmgbuild can exhaust its detach retries while macOS still holds the
          # temporary volume open. Retry only that transient failure, with a
          # fresh log each time; signing/configuration errors must fail at once.
          log="$RUNNER_TEMP/timone-desktop-package.log"
          for attempt in 1 2 3; do
            if pnpm run dist --"$DESKTOP_ARCH" > "$log" 2>&1; then
              cat "$log"
              exit 0
            else
              status=$?
            fi
            cat "$log"
            if [[ "$RUNNER_OS" != macOS ]] || [[ "$attempt" == 3 ]] ||
               ! grep -Eq 'Unable to detach device cleanly: hdiutil:.*Resource busy' "$log"; then
              exit "$status"
            fi
            echo "::warning::macOS DMG volume is busy; retrying packaging (attempt $((attempt + 1))/3)."
            sleep 10
          done

      - name: Test packaged application
        working-directory: desktop
        env:
          TIMONE_TEST_EXECUTABLE: ${{ matrix.executable }}
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a pnpm run test:app
          else
            pnpm run test:app
          fi

      - name: Create disposable Kubernetes cluster for desktop acceptance
        if: runner.os == 'Linux' && matrix.arch == 'x64'
        env:
          TIMONE_DESKTOP_ACCEPTANCE_KUBECONFIG: ${{ runner.temp }}/timone-desktop-kubeconfig
          TIMONE_DESKTOP_ACCEPTANCE_DIR: ${{ runner.temp }}/timone-desktop-fixtures
        run: |
          go install sigs.k8s.io/kind@v0.33.0
          kind create cluster --name timone-desktop-acceptance --kubeconfig "$TIMONE_DESKTOP_ACCEPTANCE_KUBECONFIG" \
            --image kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5 --wait 180s
          python3 tests/desktop/prepare.py

      - name: Test packaged desktop against real Kubernetes
        if: runner.os == 'Linux' && matrix.arch == 'x64'
        working-directory: desktop
        env:
          TIMONE_DESKTOP_ACCEPTANCE_DIR: ${{ runner.temp }}/timone-desktop-fixtures
          TIMONE_TEST_EXECUTABLE: ${{ matrix.executable }}
        run: xvfb-run -a pnpm run test:cluster

      - name: Delete desktop acceptance cluster
        if: ${{ always() && runner.os == 'Linux' && matrix.arch == 'x64' }}
        run: |
          if command -v kind >/dev/null; then kind delete cluster --name timone-desktop-acceptance; fi

      - name: Upload installers
        uses: actions/upload-artifact@v6
        with:
          name: desktop-installers-${{ runner.os }}-${{ matrix.arch }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
            desktop/dist/*.deb
            desktop/dist/*.AppImage
          if-no-files-found: error
          retention-days: 14

      - name: Upload desktop test screenshot
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: desktop-report-${{ runner.os }}-${{ matrix.arch }}
          path: desktop/test-results/
          if-no-files-found: ignore
          retention-days: 7
