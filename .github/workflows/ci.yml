name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  workflows:
    name: Workflow validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
      - name: Check application version metadata
        run: |
          python3 scripts/version.py --check
          python3 -m unittest discover -s tests/version -v
      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= -pyflakes=

  packaging:
    name: Packaging (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Test Homebrew formula generation and publication
        run: python3 -m unittest discover -s tests/homebrew -v
      - name: Test desktop manifest generation
        run: python3 -m unittest discover -s tests/channels -v
      - name: Test desktop update feeds
        run: |
          python3 -m pip install --quiet --disable-pip-version-check --target "$RUNNER_TEMP/desktop-update-pyyaml" pyyaml
          PYTHONPATH="$RUNNER_TEMP/desktop-update-pyyaml" python3 -m unittest discover -s tests/release -v

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Typecheck frontend and generate fixtures
        run: pnpm --dir web run typecheck
      - name: Lint frontend
        run: pnpm --dir web run lint
      - name: Check frontend formatting
        run: pnpm --dir web run format:check
      - name: Test frontend with coverage
        run: pnpm --dir web run test:coverage

      - name: Upload frontend coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: frontend-coverage
          path: web/coverage/
          if-no-files-found: ignore
          retention-days: 14

  integration:
    name: Go and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: true
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          package_json_file: web/package.json

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          go mod download
          go mod verify
          pnpm --dir web install --frozen-lockfile

      - name: Check Go formatting
        run: |
          unformatted=$(gofmt -l cmd internal tests web/embed.go)
          if [ -n "$unformatted" ]; then
            printf 'Run gofmt on these files:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Build frontend
        run: node tests/release/frontend.mjs

      - name: Test Go packages
        run: go test -race -count=1 -timeout=10m -coverprofile=coverage.out ./...

      - name: Exercise concurrent investigation scale
        env:
          TIMONE_LOAD_TEST: '1'
        run: go test -race -count=1 -timeout=3m -run TestConcurrentInvestigationLoad -v ./internal/service

      - name: Enforce allocation budgets
        run: |
          python3 -m unittest discover -s tests/performance -v
          python3 scripts/check_benchmarks.py

      - name: Vet Go packages
        run: go vet ./...

      - name: Build application
        run: CGO_ENABLED=0 go build -trimpath -o bin/timone ./cmd/timone

      - name: Smoke test application
        run: go run ./tests/smoke -binary ./bin/timone

      - name: Install Chromium
        run: pnpm --dir web exec playwright install --with-deps chromium

      - name: Run browser and accessibility tests
        run: pnpm --dir web run test:browser

      - name: Upload coverage and browser reports
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: test-reports
          path: |
            coverage.out
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  security:
    name: Dependency security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Install frontend dependencies without lifecycle scripts
        run: pnpm --dir web install --frozen-lockfile --ignore-scripts
      - name: Build embedded frontend
        run: pnpm --dir web run build
      - name: Audit frontend dependencies
        run: pnpm --dir web audit --audit-level=low
      - name: Review desktop advisories and exception boundaries
        run: |
          node --test tests/security/desktop-audit.test.mjs
          node scripts/audit-desktop.mjs
      - name: Scan reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./cmd/... ./internal/...

  checks:
    name: Build and test
    if: ${{ always() }}
    needs: [workflows, frontend, integration, packaging, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify all checks passed
        env:
          WORKFLOWS_RESULT: ${{ needs.workflows.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          PACKAGING_RESULT: ${{ needs.packaging.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          printf '| Check | Result |\n| --- | --- |\n' >> "$GITHUB_STEP_SUMMARY"
          failed=0
          for check in WORKFLOWS FRONTEND INTEGRATION PACKAGING SECURITY; do
            variable="${check}_RESULT"
            result="${!variable}"
            printf '| %s | %s |\n' "$check" "$result" >> "$GITHUB_STEP_SUMMARY"
            if [ "$result" != success ]; then
              echo "::error::$check finished with result: $result"
              failed=1
            fi
          done
          exit "$failed"
