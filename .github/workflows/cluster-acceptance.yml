name: Scheduled Kubernetes acceptance

on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cluster-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  acceptance:
    name: Pinned disposable Kubernetes clusters
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TIMONE_ACCEPTANCE_ARTIFACTS: ${{ github.workspace }}/acceptance-artifacts
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Build application and acceptance dependencies
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web run build
          go build -trimpath -o bin/timone ./cmd/timone
          go install sigs.k8s.io/kind@v0.33.0
          pnpm --dir web exec playwright install --with-deps chromium
      - name: Exercise both pinned Kubernetes versions
        shell: bash
        run: |
          mkdir -p acceptance-artifacts
          sh tests/cluster/run.sh 2>&1 | tee acceptance-artifacts/acceptance.log
      - name: Render actual restricted-cluster response in the browser
        env:
          TIMONE_LIVE_OVERVIEW: ${{ github.workspace }}/acceptance-artifacts/1.37.0/live-overview.json
        run: node tests/browser/run.mjs --grep 'actual restricted live-cluster response'
      - name: Upload acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: cluster-acceptance
          path: |
            acceptance-artifacts/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
