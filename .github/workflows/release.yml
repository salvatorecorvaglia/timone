name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Validate version tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Expected a stable semantic version tag prefixed with v.' >&2
            exit 1
          fi

      - name: Verify embedded application version matches release tag
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import re
          from pathlib import Path

          version = json.loads(Path('web/package.json').read_text())['version']
          if os.environ['RELEASE_TAG'] != f'v{version}':
              raise SystemExit('Release tag must match the embedded version in web/package.json')
          section = re.search(
              rf'^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## |\Z)',
              Path('CHANGELOG.md').read_text(), re.MULTILINE | re.DOTALL,
          )
          if section is None or not section.group(1).strip():
              raise SystemExit(f'CHANGELOG.md has no release notes for {version}')
          PYTHON

  quality:
    name: Release checks
    needs: validate
    uses: ./.github/workflows/ci.yml

  build:
    name: Build release archives
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: true
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          package_json_file: web/package.json

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          go mod download
          go mod verify
          pnpm --dir web install --frozen-lockfile

      - name: Build frontend
        run: pnpm --dir web run build

      - name: Package release binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              name="timone_${RELEASE_TAG#v}_${os}_${arch}"
              staging=$(mktemp -d)
              binary=timone
              if [[ "$os" == windows ]]; then
                binary=timone.exe
              fi
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
                -trimpath -ldflags='-s -w' -o "$staging/$binary" ./cmd/timone
              cp README.md LICENSE CHANGELOG.md "$staging/"
              if [[ "$os" == windows ]]; then
                (cd "$staging" && zip -q "$GITHUB_WORKSPACE/release/$name.zip" "$binary" README.md LICENSE CHANGELOG.md)
              else
                tar -czf "release/$name.tar.gz" -C "$staging" "$binary" README.md LICENSE CHANGELOG.md
              fi
            done
          done
          (cd release && sha256sum *.tar.gz *.zip > checksums.txt)

      - name: Generate stable Homebrew formula
        if: ${{ !contains(github.ref_name, '-') && !contains(github.ref_name, '+') }}
        run: |
          python3 scripts/homebrew.py --version "$RELEASE_TAG" \
            --checksums release/checksums.txt --output release/timone.rb
          (cd release && sha256sum timone.rb >> checksums.txt)

      - name: Upload release archives
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: release-assets
          compression-level: 0
          path: release/*
          if-no-files-found: error
          retention-days: 7

  desktop:
    name: Desktop packages
    needs: quality
    uses: ./.github/workflows/desktop.yml
    with:
      package-only: true

  publish:
    name: Publish GitHub release
    needs: [build, desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Extract release notes from changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PYTHON'
          import os
          import re
          from pathlib import Path

          version = os.environ['RELEASE_TAG'].removeprefix('v')
          changelog = Path('CHANGELOG.md').read_text()
          section = re.search(
              rf'^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## |\Z)',
              changelog,
              re.MULTILINE | re.DOTALL,
          )
          if section is None or not section.group(1).strip():
              raise SystemExit(f'CHANGELOG.md has no release notes for {version}')
          Path(os.environ['RUNNER_TEMP'], 'release-notes.md').write_text(section.group(1).strip() + '\n')
          PYTHON

      - name: Download release archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-assets
          path: release

      - name: Verify checksums
        working-directory: release
        run: sha256sum --check checksums.txt

      - name: Download desktop installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: desktop-installers-*
          merge-multiple: true
          path: desktop-release

      - name: Merge and verify desktop update feeds
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 -m pip install --quiet --disable-pip-version-check --target "$RUNNER_TEMP/desktop-update-pyyaml" pyyaml
          PYTHONPATH="$RUNNER_TEMP/desktop-update-pyyaml" python3 scripts/desktop_update_manifests.py --directory desktop-release --version "$RELEASE_TAG"
          cp desktop-release/latest*.yml release/

      - name: Add desktop installers and checksums
        run: |
          python3 - <<'PYTHON'
          import hashlib
          import shutil
          from pathlib import Path
          assets = sorted(p for p in Path('desktop-release').iterdir() if p.suffix in ('.dmg', '.zip', '.exe', '.deb', '.AppImage'))
          if len(assets) != 9:
              raise SystemExit(f'Expected nine desktop installers, found {len(assets)}')
          with Path('release/checksums.txt').open('a') as checksums:
              for asset in assets:
                  destination = Path('release', asset.name)
                  if destination.exists():
                      raise SystemExit(f'Duplicate release asset: {asset.name}')
                  shutil.copyfile(asset, destination)
                  checksums.write(f'{hashlib.file_digest(destination.open("rb"), "sha256").hexdigest()}  {asset.name}\n')
          PYTHON
          (cd release && sha256sum --check checksums.txt)

      - name: Generate desktop channel manifests and verify all assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          python3 scripts/desktop_channels.py --version "$RELEASE_TAG" --checksums release/checksums.txt --output release
          (cd release && sha256sum timone-desktop*.rb timone-desktop*.json >> checksums.txt && sha256sum --check checksums.txt)

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" release/* \
            --draft --verify-tag --title "Timone $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          # Make the release public only after every asset has been uploaded.
          gh release edit "$RELEASE_TAG" --draft=false

  homebrew:
    name: Update stable Homebrew tap
    needs: publish
    if: ${{ !contains(github.ref_name, '-') && !contains(github.ref_name, '+') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: homebrew-tap
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-assets
          path: release
      - name: Verify release assets
        working-directory: release
        run: sha256sum --check checksums.txt
      - name: Publish formula when tap credentials are configured
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP_PULL_SYNC: ${{ vars.HOMEBREW_TAP_PULL_SYNC }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            if [ "$TAP_PULL_SYNC" = true ]; then
              echo 'The Homebrew tap syncs stable releases on its own hourly schedule.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo '::warning::Homebrew tap publication is not configured.'
            echo 'Homebrew formula is attached to the release. Automatic tap updates require HOMEBREW_TAP_TOKEN and salvatorecorvaglia/homebrew-tap.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 scripts/publish_homebrew.py --formula release/timone.rb
