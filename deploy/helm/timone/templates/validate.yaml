{{- if and (eq .Values.auth.mode "proxy") (or (not .Values.auth.trustedProxies) (not (hasPrefix "https://" .Values.publicURL))) -}}
{{- fail "Proxy mode requires trustedProxies and an explicit HTTPS publicURL" -}}
{{- end -}}
{{- if and (not .Values.prometheus.url) (or .Values.prometheus.authSecret .Values.prometheus.caConfigMap .Values.prometheus.cluster .Values.prometheus.allowHTTP) -}}
{{- fail "Prometheus settings require an explicit prometheus.url" -}}
{{- end -}}
{{- if and .Values.prometheus.url (not (hasPrefix "https://" .Values.prometheus.url)) (or .Values.prometheus.authSecret .Values.prometheus.caConfigMap (not .Values.prometheus.allowHTTP)) -}}
{{- fail "Prometheus requires HTTPS, or explicit allowHTTP without credentials or a CA file" -}}
{{- end -}}
{{- if and .Values.helmDetails.enabled (not .Values.rbac.secrets) -}}
{{- fail "helmDetails.enabled requires explicit rbac.secrets permission" -}}
{{- end -}}
{{- if and .Values.gitops.authSecret (not (or .Values.gitops.argoURL .Values.gitops.fluxRenderedURL)) }}
{{- fail "gitops.authSecret requires a GitOps endpoint" }}
{{- end }}
{{- range $endpoint := list .Values.gitops.argoURL .Values.gitops.fluxRenderedURL }}
{{- if and $endpoint (not (regexMatch "^https://[^@?#[:space:]]+$" $endpoint)) }}
{{- fail "GitOps endpoints require HTTPS without userinfo, query or fragment" }}
{{- end }}
{{- end }}

{{- if and (eq .Values.auth.mode "proxy") .Values.auth.loginTrustedProxies }}
{{- fail "auth.loginTrustedProxies is only used in token mode" }}
{{- end }}
{{- $definitions := dict }}
{{- range .Values.customResources }}
{{- $name := printf "%s.%s" .resource .group }}
{{- if hasKey $definitions $name }}{{ fail "Duplicate custom resource definition" }}{{ end }}
{{- $_ := set $definitions $name true }}
{{- end }}
