{{- if .Values.customResources }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "timone.rbacName" . }}-custom-definitions
rules:
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    resourceNames:
      {{- range .Values.customResources }}
      - {{ printf "%s.%s" .resource .group | quote }}
      {{- end }}
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "timone.rbacName" . }}-custom-definitions
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "timone.rbacName" . }}-custom-definitions
subjects:
  - kind: ServiceAccount
    name: {{ include "timone.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- range $index, $entry := .Values.customResources }}
{{- $scoped := and $entry.namespaced (ne $.Values.scope.namespace "") }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ ternary "Role" "ClusterRole" $scoped }}
metadata:
  name: {{ include "timone.rbacName" $ }}-custom-{{ $index }}
  {{- if $scoped }}
  namespace: {{ $.Values.scope.namespace }}
  {{- end }}
rules:
  - apiGroups: [{{ $entry.group | quote }}]
    resources: [{{ $entry.resource | quote }}]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ ternary "RoleBinding" "ClusterRoleBinding" $scoped }}
metadata:
  name: {{ include "timone.rbacName" $ }}-custom-{{ $index }}
  {{- if $scoped }}
  namespace: {{ $.Values.scope.namespace }}
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: {{ ternary "Role" "ClusterRole" $scoped }}
  name: {{ include "timone.rbacName" $ }}-custom-{{ $index }}
subjects:
  - kind: ServiceAccount
    name: {{ include "timone.fullname" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
