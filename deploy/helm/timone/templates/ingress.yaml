{{- if .Values.ingress.enabled }}
{{- if not (hasPrefix "https://" .Values.publicURL) }}{{ fail "Ingress requires an explicit HTTPS publicURL" }}{{ end -}}
{{- if eq .Values.auth.mode "proxy" }}{{ fail "Deploy your authenticated identity proxy in front of the ClusterIP Service; direct chart ingress is disabled in proxy mode" }}{{ end -}}
{{- $originHost := regexReplaceAll ":[0-9]+$" (get (urlParse .Values.publicURL) "host") "" -}}
{{- if ne (lower $originHost) (lower .Values.ingress.host) }}{{ fail "ingress.host must match the hostname in publicURL" }}{{ end -}}
{{- $public := required "publicURL must be explicitly configured when ingress is enabled" .Values.publicURL -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "timone.fullname" . }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ required "ingress.host is required" .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "timone.fullname" . }}
                port:
                  name: http
{{- end }}
