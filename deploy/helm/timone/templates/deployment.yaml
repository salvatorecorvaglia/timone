apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "timone.fullname" . }}
  labels:
    {{- include "timone.labels" . | nindent 4 }}
spec:
  strategy:
    type: Recreate
  progressDeadlineSeconds: 120
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "timone.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "timone.labels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 20
      serviceAccountName: {{ include "timone.fullname" . }}
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: timone
          image: {{ if .Values.image.digest }}"{{ .Values.image.repository }}@{{ .Values.image.digest }}"{{ else }}"{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"{{ end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: TIMONE_RETAINED_MIB
              value: {{ .Values.retainedMiB | quote }}
            - name: TIMONE_MODE
              value: incluster
            - name: TIMONE_LISTEN
              value: "0.0.0.0:8080"
            - name: TIMONE_DIAGNOSTICS_STARTUP_GRACE_SECONDS
              value: {{ .Values.diagnostics.startupGraceSeconds | quote }}
            - name: TIMONE_DIAGNOSTICS_WARNING_EVENT_WINDOW_SECONDS
              value: {{ .Values.diagnostics.warningEventWindowSeconds | quote }}
            - name: TIMONE_DIAGNOSTICS_RESTART_THRESHOLD
              value: {{ .Values.diagnostics.restartThreshold | quote }}
            - name: TIMONE_HELM_DETAILS
              value: {{ .Values.helmDetails.enabled | quote }}
            - name: TIMONE_NAMESPACE
              value: {{ .Values.scope.namespace | quote }}
            - name: TIMONE_PUBLIC_URL
              value: {{ .Values.publicURL | quote }}
            - name: TIMONE_TOKEN_FILE
              value: /var/run/timone-auth/token
            - name: TIMONE_AUTH_MODE
              value: {{ .Values.auth.mode | quote }}
            - name: TIMONE_TRUSTED_PROXIES
              value: {{ join "," .Values.auth.trustedProxies | quote }}
            - name: TIMONE_LOGIN_TRUSTED_PROXIES
              value: {{ join "," .Values.auth.loginTrustedProxies | quote }}
            - name: TIMONE_ACCESS_LOG
              value: {{ .Values.accessLog | quote }}
            - name: TIMONE_CUSTOM_RESOURCES
              value: {{ include "timone.customDefinitions" . | quote }}
            - name: TIMONE_ARGO_URL
              value: {{ .Values.gitops.argoURL | quote }}
            - name: TIMONE_FLUX_RENDERED_URL
              value: {{ .Values.gitops.fluxRenderedURL | quote }}
            - name: TIMONE_GITOPS_DESTINATION
              value: {{ .Values.gitops.destination | quote }}
            {{- if and .Values.gitops.authSecret .Values.gitops.argoURL }}
            - name: TIMONE_ARGO_TOKEN_FILE
              value: /var/run/timone-gitops/argo-token
            {{- end }}
            {{- if and .Values.gitops.authSecret .Values.gitops.fluxRenderedURL }}
            - name: TIMONE_FLUX_RENDERED_TOKEN_FILE
              value: /var/run/timone-gitops/flux-token
            {{- end }}
            {{- if .Values.gitops.caConfigMap }}
            - name: TIMONE_GITOPS_CA_FILE
              value: /var/run/timone-gitops/ca.crt
            {{- end }}
            - name: TIMONE_PROMETHEUS_URL
              value: {{ .Values.prometheus.url | quote }}
            - name: TIMONE_PROMETHEUS_CLUSTER
              value: {{ .Values.prometheus.cluster | quote }}
            - name: TIMONE_PROMETHEUS_ALLOW_HTTP
              value: {{ .Values.prometheus.allowHTTP | quote }}
            {{- if .Values.prometheus.authSecret }}
            - name: TIMONE_PROMETHEUS_TOKEN_FILE
              value: /var/run/timone-prometheus/token
            {{- end }}
            {{- if .Values.prometheus.caConfigMap }}
            - name: TIMONE_PROMETHEUS_CA_FILE
              value: /var/run/timone-prometheus/ca.crt
            {{- end }}
          volumeMounts:
            - name: workspace-auth
              mountPath: /var/run/timone-auth
              readOnly: true
            {{- if or .Values.prometheus.authSecret .Values.prometheus.caConfigMap }}
            - name: prometheus-config
              mountPath: /var/run/timone-prometheus
              readOnly: true
            {{- end }}
            {{- if or .Values.gitops.authSecret .Values.gitops.caConfigMap }}
            - name: gitops-config
              mountPath: /var/run/timone-gitops
              readOnly: true
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            timeoutSeconds: 6
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        {{- if or .Values.prometheus.authSecret .Values.prometheus.caConfigMap }}
        - name: prometheus-config
          projected:
            defaultMode: 0440
            sources:
              {{- if .Values.prometheus.authSecret }}
              - secret:
                  name: {{ .Values.prometheus.authSecret | quote }}
                  items:
                    - key: token
                      path: token
              {{- end }}
              {{- if .Values.prometheus.caConfigMap }}
              - configMap:
                  name: {{ .Values.prometheus.caConfigMap | quote }}
                  items:
                    - key: ca.crt
                      path: ca.crt
              {{- end }}
        {{- end }}
        {{- if or .Values.gitops.authSecret .Values.gitops.caConfigMap }}
        - name: gitops-config
          projected:
            defaultMode: 0440
            sources:
              {{- if .Values.gitops.authSecret }}
              - secret:
                  name: {{ .Values.gitops.authSecret | quote }}
                  items:
                    {{- if .Values.gitops.argoURL }}
                    - key: argo-token
                      path: argo-token
                    {{- end }}
                    {{- if .Values.gitops.fluxRenderedURL }}
                    - key: flux-token
                      path: flux-token
                    {{- end }}
              {{- end }}
              {{- if .Values.gitops.caConfigMap }}
              - configMap:
                  name: {{ .Values.gitops.caConfigMap | quote }}
                  items:
                    - key: ca.crt
                      path: ca.crt
              {{- end }}
        {{- end }}
        - name: workspace-auth
          secret:
            secretName: {{ required "auth.existingSecret is required" .Values.auth.existingSecret }}
            defaultMode: 0440
            items:
              - key: token
                path: token
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
