{{- $scoped := ne .Values.scope.namespace "" -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ ternary "Role" "ClusterRole" $scoped }}
metadata:
  name: {{ include "timone.rbacName" . }}-namespaced
  {{- if $scoped }}
  namespace: {{ .Values.scope.namespace }}
  {{- end }}
  labels:
    {{- include "timone.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods, services, events, configmaps, persistentvolumeclaims, serviceaccounts]
    verbs: [get, list, watch]
  {{- if .Values.rbac.secrets }}
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list]
  {{- end }}
  {{- if .Values.rbac.podLogs }}
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  {{- end }}
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    verbs: [get, list]
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [get, list]
  - apiGroups: [kustomize.toolkit.fluxcd.io]
    resources: [kustomizations]
    verbs: [get, list]
  - apiGroups: [helm.toolkit.fluxcd.io]
    resources: [helmreleases]
    verbs: [get, list]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gateways, httproutes, referencegrants]
    verbs: [get, list]
  {{- if .Values.rbac.metrics }}
  - apiGroups: [metrics.k8s.io]
    resources: [pods]
    verbs: [get, list]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ ternary "RoleBinding" "ClusterRoleBinding" $scoped }}
metadata:
  name: {{ include "timone.rbacName" . }}-namespaced
  {{- if $scoped }}
  namespace: {{ .Values.scope.namespace }}
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: {{ ternary "Role" "ClusterRole" $scoped }}
  name: {{ include "timone.rbacName" . }}-namespaced
subjects:
  - kind: ServiceAccount
    name: {{ include "timone.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.rbac.clusterResources }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "timone.rbacName" . }}-cluster
rules:
  - apiGroups: [""]
    resources: [nodes, namespaces, persistentvolumes]
    verbs: [get, list, watch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gatewayclasses]
    verbs: [get, list]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles, clusterrolebindings]
    verbs: [get, list]
  {{- if .Values.rbac.metrics }}
  - apiGroups: [metrics.k8s.io]
    resources: [nodes]
    verbs: [get, list]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "timone.rbacName" . }}-cluster
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "timone.rbacName" . }}-cluster
subjects:
  - kind: ServiceAccount
    name: {{ include "timone.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- if .Values.rbac.discovery }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "timone.rbacName" . }}-discovery
rules:
  - nonResourceURLs: ["/version", "/api", "/api/*", "/apis", "/apis/*"]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "timone.rbacName" . }}-discovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "timone.rbacName" . }}-discovery
subjects:
  - kind: ServiceAccount
    name: {{ include "timone.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- if .Values.rbac.subjectAccessReviews }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "timone.rbacName" . }}-authorization-review
rules:
  - apiGroups: [authorization.k8s.io]
    resources: [selfsubjectaccessreviews, subjectaccessreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "timone.rbacName" . }}-authorization-review
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "timone.rbacName" . }}-authorization-review
subjects:
  - kind: ServiceAccount
    name: {{ include "timone.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
