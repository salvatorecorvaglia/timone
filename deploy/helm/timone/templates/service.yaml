apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "timone.fullname" . }}
  labels:
    {{- include "timone.labels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "timone.fullname" . }}
  labels:
    {{- include "timone.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "timone.labels" . | nindent 4 }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      name: http
