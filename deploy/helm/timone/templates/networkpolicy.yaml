{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "timone.fullname" . }}
spec:
  podSelector:
    matchLabels:
      {{- include "timone.labels" . | nindent 6 }}
  policyTypes: [Ingress]
  {{- if .Values.networkPolicy.ingressPeers }}
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.ingressPeers | nindent 8 }}
      ports:
        - protocol: TCP
          port: 8080
  {{- else }}
  ingress: []
  {{- end }}
{{- end }}
