name: Sync Timone release

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: stable-tap-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      ready: ${{ steps.sync.outputs.ready }}
      changed: ${{ steps.sync.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Pull verified stable formula
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sync_homebrew.py

  test:
    needs: sync
    if: ${{ needs.sync.outputs.ready == 'true' && (needs.sync.outputs.changed == 'true' || github.event_name != 'schedule') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_ANALYTICS: '1'
    steps:
      - name: Enable Homebrew on Linux
        if: runner.os == 'Linux'
        run: echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
      - name: Install and test the public formula
        run: |
          brew install salvatorecorvaglia/tap/timone
          brew test salvatorecorvaglia/tap/timone
          timone --version
          kubectl-timone --version
