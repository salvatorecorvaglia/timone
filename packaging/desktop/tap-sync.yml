name: Sync desktop channels

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/desktop-sync.yml']

permissions:
  contents: read

concurrency:
  group: desktop-channel-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      ready: ${{ steps.sync.outputs.ready }}
      changed: ${{ steps.sync.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Pull verified desktop release manifests
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sync_desktop_channels.py --target homebrew
  test:
    needs: sync
    if: ${{ needs.sync.outputs.ready == 'true' && (needs.sync.outputs.changed == 'true' || github.event_name != 'schedule') }}
    uses: ./.github/workflows/desktop.yml
